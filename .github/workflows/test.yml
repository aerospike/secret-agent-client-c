name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: make test (${{ matrix.distro }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: ubuntu22.04, runner: ubuntu-22.04, container: '' }
          - { distro: ubuntu24.04, runner: ubuntu-24.04, container: '' }
          - { distro: ubuntu24.04-asan, runner: ubuntu-24.04, container: '', cc: 'gcc -fsanitize=address -fno-omit-frame-pointer' }
          - { distro: ubuntu26.04, runner: ubuntu-24.04, container: 'ubuntu:26.04' }
          - { distro: el8,         runner: ubuntu-24.04, container: 'rockylinux/rockylinux:8' }
          - { distro: el9,         runner: ubuntu-24.04, container: 'rockylinux/rockylinux:9' }
          - { distro: el10,        runner: ubuntu-24.04, container: 'rockylinux/rockylinux:10' }
    steps:
      - name: Harden the runner (Audit all outbound calls)
        if: matrix.container == ''
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Install build dependencies (ubuntu)
        if: startsWith(matrix.distro, 'ubuntu')
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y build-essential libssl-dev libjansson-dev openssl

      - name: Install build dependencies (el)
        if: startsWith(matrix.distro, 'el')
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled ${{ matrix.distro == 'el8' && 'powertools' || 'crb' }}
          dnf install -y gcc make openssl openssl-devel jansson-devel

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Add fe80::1 to loopback for the scoped IPv6 test
        if: matrix.container == ''
        run: sudo ip -6 addr add fe80::1/64 dev lo

      - name: make test
        env:
          CC: ${{ matrix.cc || 'cc' }}
        run: make test

  macos:
    name: make test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install build dependencies
        run: |
          brew install jansson openssl@3
          echo "CPATH=$(brew --prefix openssl@3)/include:$(brew --prefix jansson)/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix openssl@3)/lib:$(brew --prefix jansson)/lib" >> "$GITHUB_ENV"

      - name: make test
        run: make test
